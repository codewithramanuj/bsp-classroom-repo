spring:
  application:
    name: support-assistant-security-database

  datasource:
    # Oracle XE on your own machine. For another database, set DB_URL:
    # jdbc:oracle:thin:@//ORACLE_HOST:1521/ORACLE_SERVICE
    url: jdbc:oracle:thin:@//10.145.1.234:1522/test
    username: test
    password: test123

  jpa:
    # The table is made by db/oracle/01-tables.sql. JPA must never create or change it.
    hibernate:
      ddl-auto: none
    # Close the database session at the end of the service method, not at the end of the request.
    open-in-view: false
